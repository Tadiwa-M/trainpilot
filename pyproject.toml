[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainpilot"
version = "0.1.0"
description = "A cautious local training agent: a small LLM plans YOLO runs, code enforces limits, and dataset-gate must pass before anything trains."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "dsgate"]

[project.scripts]
tpilot = "trainpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
